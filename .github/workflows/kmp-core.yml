name: KMP Core

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/kmp-core.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/kmp-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Test JVM and JavaScript targets
        run: gradle -p core --no-daemon jvmTest jsNodeTest compileKotlinJs compileCommonMainKotlinMetadata
