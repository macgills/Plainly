name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  live-openai:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_SECRET: ${{ secrets.AI_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify live OpenAI secret
        shell: bash
        run: |
          if [ -z "$AI_SECRET" ]; then
            echo "::error::AI_SECRET repository secret is required for the live integration test"
            exit 1
          fi
      - name: Run live Plainly integration test
        run: npm run test:live
      - name: Publish shareable Plainly demo
        uses: actions/upload-artifact@v4
        with:
          name: plainly-live-demo-${{ github.run_number }}
          path: |
            artifacts/
            extension/
          if-no-files-found: error
          retention-days: 30
