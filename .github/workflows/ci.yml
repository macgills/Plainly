name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: KMP core + browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Test KMP core and build browser bundle
        run: gradle -p core --no-daemon jvmTest jsNodeTest compileCommonMainKotlinMetadata jsBrowserProductionWebpack
      - name: Publish KMP browser bundle for extension jobs
        uses: actions/upload-artifact@v4
        with:
          name: plainly-kmp-browser
          path: core/build/kotlin-webpack/js/productionExecutable/plainly-core.js
          if-no-files-found: error
          retention-days: 1

  safari-ios:
    name: Safari iPad package
    needs: core
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plainly-kmp-browser
          path: extension/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble Safari-compatible extension manifest
        run: npm run build:safari-extension
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Link KMP iOS simulator framework
        run: gradle -p core --no-daemon linkDebugFrameworkIosSimulatorArm64
      - name: Package, build, install and launch Safari Web Extension host on iPad simulator
        shell: bash
        run: |
          set -euo pipefail

          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            PACKAGER=safari-web-extension-packager
          elif xcrun --find safari-web-extension-converter >/dev/null 2>&1; then
            PACKAGER=safari-web-extension-converter
          else
            echo "::error::Xcode does not provide a Safari Web Extension packager"
            exit 1
          fi

          rm -rf safari-generated safari-derived artifacts-safari
          mkdir -p safari-generated artifacts-safari

          xcodebuild -version | tee artifacts-safari/xcode-version.txt
          echo "Safari packager: $PACKAGER" | tee artifacts-safari/packager-tool.txt

          xcrun "$PACKAGER" build/safari-extension \
            --project-location "$PWD/safari-generated" \
            --app-name Plainly \
            --bundle-identifier dev.plainly.browser \
            --swift \
            --ios-only \
            --copy-resources \
            --no-open \
            --no-prompt 2>&1 | tee artifacts-safari/packager.log

          if grep -Eiq 'not supported by (your )?(current version of )?Safari' artifacts-safari/packager.log; then
            echo "::error::Safari packager reported unsupported manifest keys"
            exit 1
          fi

          PROJECT="$(find safari-generated -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Safari packager did not create an Xcode project"
            exit 1
          fi

          PBXPROJ="$PROJECT/project.pbxproj"
          python3 - "$PBXPROJ" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])
          text = project.read_text(encoding="utf-8")
          generated_host_id = "dev.plainly.Plainly"
          desired_host_id = "dev.plainly.browser"
          occurrences = text.count(generated_host_id)
          if occurrences == 0:
              raise SystemExit(f"Generated Xcode project did not contain expected host bundle id {generated_host_id}")
          project.write_text(text.replace(generated_host_id, desired_host_id), encoding="utf-8")
          print(f"Normalized {occurrences} generated host bundle identifier setting(s) to {desired_host_id}")
          PY

          if ! grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = dev.plainly.browser;' "$PBXPROJ"; then
            echo "::error::Generated host target does not use dev.plainly.browser"
            exit 1
          fi
          if ! grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = dev.plainly.browser.Extension;' "$PBXPROJ"; then
            echo "::error::Generated extension target does not use dev.plainly.browser.Extension"
            exit 1
          fi

          xcodebuild -project "$PROJECT" -list -json > artifacts-safari/xcode-project.json
          SCHEME="$(python3 - <<'PY'
          import json
          with open('artifacts-safari/xcode-project.json', encoding='utf-8') as handle:
              project = json.load(handle)['project']
          schemes = project.get('schemes', [])
          preferred = [scheme for scheme in schemes if '(iOS)' in scheme and 'Extension' not in scheme]
          if not schemes:
              raise SystemExit('No Xcode schemes were generated')
          print((preferred or schemes)[0])
          PY
          )"
          echo "Building scheme: $SCHEME" | tee artifacts-safari/scheme.txt

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/safari-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee artifacts-safari/xcodebuild.log

          APP="$(find safari-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Xcode did not produce an iOS simulator app"
            exit 1
          fi

          APPEX="$(find "$APP" -name '*.appex' -print -quit)"
          if [ -z "$APPEX" ]; then
            echo "::error::Built app does not contain a Safari Web Extension"
            exit 1
          fi

          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          APPEX_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")"
          if [ "$APP_BUNDLE_ID" != 'dev.plainly.browser' ]; then
            echo "::error::Unexpected host bundle identifier: $APP_BUNDLE_ID"
            exit 1
          fi
          if [ "$APPEX_BUNDLE_ID" != 'dev.plainly.browser.Extension' ]; then
            echo "::error::Unexpected extension bundle identifier: $APPEX_BUNDLE_ID"
            exit 1
          fi

          FRAMEWORK='core/build/bin/iosSimulatorArm64/debugFramework/PlainlyCore.framework'
          if [ ! -d "$FRAMEWORK" ]; then
            echo "::error::KMP iOS simulator framework was not produced"
            exit 1
          fi

          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'],
              text=True,
          ))['devices']
          for runtime, candidates in devices.items():
              if 'iOS' not in runtime:
                  continue
              for device in candidates:
                  if 'iPad' in device['name']:
                      print(device['udid'])
                      raise SystemExit(0)

          device_types = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devicetypes', '-j'],
              text=True,
          ))['devicetypes']
          device_type = next(item for item in device_types if 'iPad' in item['name'])
          runtimes = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'runtimes', 'available', '-j'],
              text=True,
          ))['runtimes']
          runtime = next(item for item in reversed(runtimes) if 'iOS' in item['identifier'])
          print(subprocess.check_output(
              ['xcrun', 'simctl', 'create', 'Plainly CI iPad', device_type['identifier'], runtime['identifier']],
              text=True,
          ).strip())
          PY
          )"

          echo "iPad simulator: $SIMULATOR_UDID" | tee artifacts-safari/simulator.txt
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          INSTALLED_APP="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$APP_BUNDLE_ID" app)"
          if [ -z "$INSTALLED_APP" ]; then
            echo "::error::Plainly host app was not installed on the iPad simulator"
            exit 1
          fi
          echo "Installed app container: $INSTALLED_APP" | tee artifacts-safari/simctl-install.txt
          xcrun simctl launch "$SIMULATOR_UDID" "$APP_BUNDLE_ID" | tee artifacts-safari/simctl-launch.txt
          xcrun simctl listapps "$SIMULATOR_UDID" > artifacts-safari/simctl-listapps.txt
          xcrun simctl shutdown "$SIMULATOR_UDID" || true

          cp -R "$APP" artifacts-safari/
          cp -R "$FRAMEWORK" artifacts-safari/
          cp -R "$PROJECT" artifacts-safari/
          cp build/safari-extension/manifest.json artifacts-safari/safari-manifest.json
          cp extension/manifest.json artifacts-safari/chrome-manifest.json

          cat > artifacts-safari/validation.txt <<EOF
          Plainly Safari/iPad CI validation
          Safari packager: $PACKAGER
          Xcode project: $PROJECT
          Xcode scheme: $SCHEME
          Simulator app: $APP
          Host bundle identifier: $APP_BUNDLE_ID
          Embedded extension: $APPEX
          Extension bundle identifier: $APPEX_BUNDLE_ID
          KMP framework: $FRAMEWORK
          iPad simulator: $SIMULATOR_UDID
          Installed app container: $INSTALLED_APP
          Host app launch: passed
          Safari uses a classic MV3 background service worker; Chrome remains a module service worker.
          EOF
      - name: Publish Safari/iPad build proof
        uses: actions/upload-artifact@v4
        with:
          name: plainly-safari-ios-${{ github.run_number }}
          path: artifacts-safari/
          if-no-files-found: error
          retention-days: 30

  test:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plainly-kmp-browser
          path: extension/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build deterministic Plainly preview
        run: npm run demo
      - name: Publish prototype preview
        uses: actions/upload-artifact@v4
        with:
          name: plainly-prototype-preview-${{ github.run_number }}
          path: |
            artifacts-preview/
            extension/
          if-no-files-found: error
          retention-days: 30

  live-openai:
    name: Live OpenAI (non-blocking)
    needs: core
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_SECRET: ${{ secrets.AI_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plainly-kmp-browser
          path: extension/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify live OpenAI secret
        shell: bash
        run: |
          if [ -z "$AI_SECRET" ]; then
            echo "::error::AI_SECRET repository secret is required for the live integration test"
            exit 1
          fi
      - name: Probe live Responses API through production adapter
        run: npm run test:live:api
      - run: npx playwright install --with-deps chromium
      - name: Run live Plainly browser integration test
        run: npm run test:live
      - name: Build teacher evaluation pack
        run: npm run eval:live
      - name: Publish shareable live Plainly demo
        uses: actions/upload-artifact@v4
        with:
          name: plainly-live-demo-${{ github.run_number }}
          path: |
            artifacts/
            extension/
          if-no-files-found: error
          retention-days: 30
      - name: Publish teacher review pack
        uses: actions/upload-artifact@v4
        with:
          name: plainly-teacher-review-${{ github.run_number }}
          path: evaluation-artifacts/
          if-no-files-found: error
          retention-days: 30
