<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plainly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>Plainly</strong>
        <label class="switch-row">
          <span>Adjusted reading</span>
          <input id="enabled" type="checkbox" />
        </label>
      </header>
      <fieldset>
        <legend>Reading level</legend>
        <label><input type="radio" name="level" value="1" /> Level 1</label>
        <label><input type="radio" name="level" value="2" /> Level 2</label>
        <label><input type="radio" name="level" value="3" /> Level 3</label>
      </fieldset>
      <p>Changes apply automatically to the next Wikipedia page you open.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
