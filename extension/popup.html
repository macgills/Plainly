<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Plainly</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main>
      <header><strong>Plainly</strong><label class="switch-row"><span>Adjusted reading</span><input id="enabled" type="checkbox" /></label></header>

      <section class="api-key-section" aria-labelledby="api-key-heading">
        <div class="section-heading" id="api-key-heading">OpenAI API key</div>
        <div class="api-key-row"><input id="api-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" aria-label="OpenAI API key" /><button id="save-key" type="button">Save</button></div>
        <div class="key-state-row"><span id="key-status" role="status">Checking…</span><button id="remove-key" class="link-button" type="button" hidden>Remove</button></div>
        <p class="hint">Stored in this Chrome profile and sent only to OpenAI when Plainly adjusts a page.</p>
      </section>

      <section class="reading-section" aria-labelledby="reading-heading">
        <div class="section-heading" id="reading-heading">Reading target</div>
        <label class="select-label" for="scheme">Reading scheme</label>
        <select id="scheme">
          <option value="oxford">Oxford Reading Tree</option>
          <option value="fountasPinnell">Fountas &amp; Pinnell</option>
        </select>
        <label class="select-label" for="level">Level</label>
        <select id="level"></select>
        <p id="scheme-note" class="hint"></p>
      </section>

      <p>Changes apply automatically to the next supported article you open or reload.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
